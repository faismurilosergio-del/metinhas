<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metinhas dos Nenéns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* tokens fixos */
    --ink:#3a2c50;
    --ink-soft:#8479a0;
    --surface:rgba(255,255,255,0.66);
    --surface-strong:rgba(255,255,255,0.86);
    --glass-edge:rgba(255,255,255,0.75);
    --hair:rgba(58,44,80,0.09);
    --p1:#5B8DEF;      --p1-soft:rgba(91,141,239,0.15);
    --p2:#EF6BA6;      --p2-soft:rgba(239,107,166,0.15);
    --danger:#E0607A;  --danger-soft:rgba(224,96,122,0.14);
    --ok:#2FBE86;
    --radius:24px; --radius-sm:16px; --radius-xs:12px;
    --shadow:0 10px 34px rgba(58,44,80,0.12), 0 2px 8px rgba(58,44,80,0.05);
    --shadow-soft:0 6px 20px rgba(58,44,80,0.08);
    /* tokens dinâmicos (tema) — sobrescritos via JS */
    --accent:#E86AA6;
    --accent-2:#B98CF0;
    --accent-soft:rgba(232,106,166,0.14);
    --tint:#FDEFF6;
    --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:var(--font);
    color:var(--ink);
    background-color:var(--tint);
    transition:background-color 4s ease;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:var(--font);color:var(--ink);}
  ::selection{background:var(--accent-soft);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--accent);}

  /* ---------- Fundo vivo ---------- */
  #blobs{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(52px);opacity:0.55;transition:background-color 4s ease;will-change:transform;}
  #veil{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,0.15), rgba(255,255,255,0.55) 70%);}
  @keyframes drift1{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,-30px) scale(1.15);}}
  @keyframes drift2{0%{transform:translate(0,0) scale(1.1);}100%{transform:translate(-50px,40px) scale(0.9);}}
  @keyframes drift3{0%{transform:translate(0,0) scale(0.95);}100%{transform:translate(30px,50px) scale(1.1);}}

  /* ---------- Loading ---------- */
  #loadingScreen{position:fixed;inset:0;background:var(--tint);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;}
  #loadingScreen .logo{font-size:26px;font-weight:800;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  #loadingScreen .spinner{width:32px;height:32px;border-radius:50%;
    border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Shell responsivo ---------- */
  .app-shell{display:flex;min-height:100vh;max-width:1180px;margin:0 auto;}
  .sidebar{display:none;}
  .content-col{flex:1;min-width:0;padding-bottom:96px;}
  main{max-width:720px;margin:0 auto;padding:8px 16px 32px;}
  .view{display:none;}
  .view.active{display:block;}
  .view.active > *{animation:rise .4s cubic-bezier(.2,.7,.3,1) backwards;}
  .view.active > *:nth-child(2){animation-delay:.04s;}
  .view.active > *:nth-child(3){animation-delay:.08s;}
  .view.active > *:nth-child(4){animation-delay:.12s;}
  .view.active > *:nth-child(n+5){animation-delay:.15s;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---------- Header ---------- */
  .topbar{position:sticky;top:0;z-index:40;padding:14px 16px 10px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0));}
  .greet{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .greet h1{font-size:19px;font-weight:800;}
  .greet .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .gear{width:40px;height:40px;border-radius:50%;flex-shrink:0;font-size:17px;
    background:var(--surface);border:1px solid var(--glass-edge);box-shadow:var(--shadow-soft);
    display:flex;align-items:center;justify-content:center;}
  .gear:active{transform:scale(.94);}

  .couple-band{display:flex;align-items:center;gap:10px;margin-top:12px;
    background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius);
    box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 12px;}
  .cb-person{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .cb-person.right{flex-direction:row-reverse;text-align:right;}
  .avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:19px;box-shadow:0 3px 10px rgba(58,44,80,0.12);}
  .avatar.p1{background:linear-gradient(135deg,#7FA8F5,#5B8DEF);}
  .avatar.p2{background:linear-gradient(135deg,#F58FBE,#EF6BA6);}
  .avatar.couple{background:linear-gradient(135deg,var(--accent),var(--accent-2));}
  .avatar.sm{width:26px;height:26px;font-size:14px;box-shadow:none;}
  .cb-person .nm{font-size:13px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cb-person .bal{font-size:12px;font-weight:700;}
  .cb-person.left .bal{color:var(--p1);}
  .cb-person.right .bal{color:var(--p2);}
  .cb-heart{font-size:16px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(232,106,166,.4));}
  .cb-couple{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding:0 4px;}
  .cb-couple .lbl{font-size:9.5px;color:var(--ink-soft);font-weight:600;}
  .cb-couple .bal{font-size:12px;font-weight:800;color:var(--accent);}

  /* ---------- Section titles ---------- */
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 12px;}
  .section-title:first-child{margin-top:8px;}
  .section-title h2{font-size:16px;font-weight:700;}

  /* ---------- Cards genéricos ---------- */
  .card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius);
    box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px;margin-bottom:12px;}
  .empty-state{text-align:center;padding:34px 18px;color:var(--ink-soft);font-size:13.5px;line-height:1.5;
    background:var(--surface);border:1px dashed var(--glass-edge);border-radius:var(--radius);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .empty-state .em{font-size:32px;display:block;margin-bottom:10px;}

  /* ---------- Botões ---------- */
  .btn{border-radius:999px;border:1px solid var(--hair);background:var(--surface-strong);
    padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--ink);transition:transform .12s ease, box-shadow .2s ease;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;
    box-shadow:0 6px 18px var(--accent-soft);}
  .btn-success{background:linear-gradient(135deg,#48CFA0,#2FBE86);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(47,190,134,.25);}
  .btn-danger{background:var(--surface-strong);color:var(--danger);border-color:var(--danger-soft);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);box-shadow:none;}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-block{width:100%;display:block;text-align:center;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  /* ---------- Agenda: resumo / pessoas / registros ---------- */
  .date-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 16px;}
  .date-nav .date-label{font-size:15px;font-weight:700;min-width:160px;text-align:center;}
  .date-nav button{width:38px;height:38px;border-radius:50%;background:var(--surface);
    border:1px solid var(--glass-edge);box-shadow:var(--shadow-soft);font-size:13px;}
  .date-nav button:active{transform:scale(.92);}
  .date-nav button[disabled]{opacity:.35;pointer-events:none;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px;}
  .stat-card .val{font-size:23px;font-weight:800;letter-spacing:-0.02em;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:500;}

  .person-band{display:flex;align-items:center;gap:9px;margin:20px 2px 10px;}
  .person-band strong{font-size:14.5px;font-weight:700;}
  .person-band .stat{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:600;}

  .progress-track{height:9px;border-radius:999px;background:rgba(58,44,80,0.1);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1);}
  .progress-fill.p1{background:linear-gradient(90deg,#7FA8F5,#5B8DEF);}
  .progress-fill.p2{background:linear-gradient(90deg,#F58FBE,#EF6BA6);}
  .progress-fill.couple{background:linear-gradient(90deg,var(--accent),var(--accent-2));}

  .rec-row{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:13px 14px;margin-bottom:9px;transition:transform .12s ease, box-shadow .2s ease;}
  .rec-row.done{background:linear-gradient(180deg, rgba(47,190,134,0.09), var(--surface));border-color:rgba(47,190,134,0.25);}
  .rec-row.miss{opacity:.72;}
  .rec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .rec-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .rec-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
  .rec-money{font-size:11.5px;font-weight:700;white-space:nowrap;text-align:right;}
  .rec-money .rw{color:var(--ok);}
  .rec-money .pn{color:var(--danger);display:block;}
  .rec-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center;}
  .streak-flame{font-size:12px;font-weight:800;color:#F5883B;background:rgba(245,136,59,0.13);
    padding:2px 8px;border-radius:999px;}
  .status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .status-badge.completed{background:rgba(47,190,134,0.16);color:#1E9E6C;}
  .status-badge.failed{background:var(--danger-soft);color:var(--danger);}
  .status-badge.skipped,.status-badge.expired{background:rgba(58,44,80,0.08);color:var(--ink-soft);}
  .value-entry{display:flex;gap:6px;align-items:center;}
  .value-entry input{width:96px;padding:8px 10px;border-radius:10px;border:1px solid var(--hair);font-size:13px;background:var(--surface-strong);}

  /* ---------- Metas ---------- */
  .goal-card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px;margin-bottom:10px;}
  .goal-card.inactive{opacity:.5;}
  .g-top{display:flex;justify-content:space-between;gap:10px;}
  .g-title{font-weight:700;font-size:15px;}
  .g-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .chip{display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;
    padding:3px 10px;font-size:11.5px;font-weight:700;margin-right:6px;margin-top:7px;}
  .chip.neutral{background:rgba(58,44,80,0.07);color:var(--ink-soft);}

  /* ---------- Loja (catálogo de experiências) ---------- */
  .product-card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius);
    box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;}
  .product-card::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,var(--accent-soft),transparent 60%);opacity:.5;pointer-events:none;}
  .product-card > *{position:relative;}
  .p-emoji{font-size:34px;width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--surface-strong);border-radius:16px;box-shadow:var(--shadow-soft);}
  .p-body{flex:1;min-width:0;}
  .p-title{font-weight:700;font-size:15.5px;}
  .p-price{font-weight:800;font-size:14px;color:var(--accent);margin-top:1px;}
  .p-desc{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4;font-style:italic;}
  .p-meta{font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .p-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end;flex-shrink:0;}

  /* ---------- Desafios ---------- */
  .challenge-card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius);
    box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px;margin-bottom:12px;}
  .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .c-title{font-weight:700;font-size:15.5px;}
  .c-desc{font-size:13px;color:var(--ink-soft);margin:5px 0 12px;line-height:1.45;}
  .c-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:7px;font-weight:600;}

  /* ---------- Dashboard ---------- */
  table.compare{width:100%;border-collapse:collapse;font-size:13px;}
  table.compare th,table.compare td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--hair);}
  table.compare tr:last-child td{border-bottom:none;}
  table.compare th:first-child,table.compare td:first-child{text-align:left;color:var(--ink-soft);}
  table.compare th{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  table.compare td{font-weight:600;}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
  .badge-tile{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-soft);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 8px;text-align:center;}
  .badge-tile.locked{opacity:.4;filter:grayscale(.6);}
  .badge-tile .b-emoji{font-size:26px;}
  .badge-tile .b-title{font-size:10.5px;font-weight:700;margin-top:6px;line-height:1.25;}
  svg.chart text{font-family:var(--font);fill:var(--ink-soft);font-size:9px;}

  /* ---------- Navegação ---------- */
  nav.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:45;display:flex;justify-content:space-around;gap:2px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,0.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--glass-edge);}
  nav.bottombar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 6px;border-radius:14px;
    color:var(--ink-soft);font-size:10px;font-weight:700;flex:1;transition:all .2s ease;}
  nav.bottombar button .ic{font-size:19px;transition:transform .2s ease;}
  nav.bottombar button.active{color:var(--accent);background:var(--accent-soft);}
  nav.bottombar button.active .ic{transform:scale(1.15) translateY(-1px);}

  /* ---------- Modal ---------- */
  #modalRoot{position:fixed;inset:0;z-index:200;pointer-events:none;}
  #modalRoot:empty{display:none;}
  .modal-overlay{position:fixed;inset:0;pointer-events:auto;background:rgba(58,44,80,0.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease;}
  @media (min-width:640px){.modal-overlay{align-items:center;}}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .modal-box{background:linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.99));
    width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 20px 28px;
    box-shadow:0 -10px 40px rgba(58,44,80,0.2);animation:slideup .28s cubic-bezier(.2,.7,.3,1);}
  @media (min-width:640px){.modal-box{border-radius:26px;animation:pop .28s cubic-bezier(.2,.7,.3,1);}}
  @keyframes slideup{from{transform:translateY(30px);opacity:.6;}to{transform:none;opacity:1;}}
  @keyframes pop{from{transform:scale(.96);opacity:.6;}to{transform:none;opacity:1;}}
  .modal-box h3{font-size:18px;font-weight:800;margin-bottom:14px;}
  .modal-close{float:right;font-size:22px;color:var(--ink-soft);line-height:1;width:30px;height:30px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
    width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--hair);font-size:14.5px;background:#F7F4FB;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field textarea{min-height:58px;resize:vertical;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .checkline{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:11px;font-weight:500;}
  .checkline input{width:18px;height:18px;accent-color:var(--accent);}
  .daychecks{display:flex;gap:6px;flex-wrap:wrap;}
  .daychecks label{border:1px solid var(--hair);border-radius:10px;padding:7px 0;width:40px;text-align:center;font-size:11.5px;
    color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;background:#F7F4FB;font-weight:600;}
  .daychecks input{width:15px;height:15px;accent-color:var(--accent);}
  .fieldset-label{font-size:11px;font-weight:800;letter-spacing:0.07em;color:var(--accent);text-transform:uppercase;margin:18px 0 9px;}
  .fieldset-label:first-of-type{margin-top:0;}
  .radio-cards{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-cards label{border:1px solid var(--hair);border-radius:12px;padding:9px 13px;font-size:13px;cursor:pointer;background:#F7F4FB;font-weight:600;}
  .radio-cards input{margin-right:6px;accent-color:var(--accent);}

  /* ---------- Toast + Comemoração ---------- */
  #toastRoot{position:fixed;left:0;right:0;bottom:96px;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
  .toast{background:rgba(58,44,80,0.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 8px 24px rgba(58,44,80,.3);animation:toastin .3s ease, toastout .3s ease 2.2s forwards;}
  @keyframes toastin{from{transform:translateY(16px);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes toastout{to{transform:translateY(16px);opacity:0;}}

  #celebrateRoot{position:fixed;inset:0;z-index:350;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .celebrate{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    animation:celebpop .5s cubic-bezier(.2,.9,.3,1.2), celebout .4s ease 1s forwards;}
  .celebrate .big{font-size:60px;filter:drop-shadow(0 6px 16px rgba(58,44,80,.25));}
  .celebrate .headline{font-size:24px;font-weight:800;color:var(--ink);}
  .celebrate .amount{font-size:20px;font-weight:800;}
  .celebrate .amount.win{color:var(--ok);}
  .celebrate .amount.lose{color:var(--danger);}
  .celebrate .sub{font-size:14px;font-weight:600;color:var(--ink-soft);}
  @keyframes celebpop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes celebout{to{transform:scale(1.05) translateY(-10px);opacity:0;}}

  /* ---------- Identidade por dispositivo ---------- */
  #deviceUserSlot{margin-top:10px;}

  .id-overlay{position:fixed;inset:0;z-index:400;pointer-events:auto;background:linear-gradient(160deg,var(--tint),#fff);

  .id-person:active{transform:scale(.96);}

  .id-setup{background:var(--surface);border:1px solid var(--glass-edge);border-radius:24px;box-shadow:var(--shadow);
    padding:22px;width:100%;max-width:420px;text-align:left;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:16px 0;}

  .pin-pad button:active{transform:scale(.94);}

  /* ---------- Painel: seletor de período ---------- */
  .period-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
  .period-bar button{white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
    background:var(--surface);border:1px solid var(--glass-edge);color:var(--ink-soft);box-shadow:var(--shadow-soft);

  .period-bar button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;}

    border:1px solid rgba(245,136,59,0.3);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:12px;
    font-size:12.5px;font-weight:600;color:#9A5B12;}

  /* ---------- Misc ---------- */

  .hidden{display:none !important;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}

  /* ---------- Biblioteca ---------- */
  .lib-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .lib-tabs button{flex:1;padding:10px;border-radius:12px;font-weight:700;font-size:13.5px;
    background:#F3F0F8;color:var(--ink-soft);}

  .lib-seg .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .lib-seg button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:#F3F0F8;color:var(--ink-soft);}
  .lib-seg button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
  .lib-cat{font-size:12.5px;font-weight:800;color:var(--ink);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .lib-cat button{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;}
  .lib-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--hair);}
  .lib-item .li-emoji{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
  .lib-item .li-body{flex:1;min-width:0;}

    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
  .lib-add.added{background:rgba(47,190,134,0.16);color:#1E9E6C;pointer-events:none;}
  .danger-zone{margin-top:22px;padding-top:16px;border-top:1px solid var(--danger-soft);}
  .danger-zone .dz-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);margin-bottom:6px;}

  /* =====================================================
     DESKTOP / PC — sidebar lateral e grids mais largos

    .sidebar .brand .logo-sub{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:2px;letter-spacing:.02em;}

  }

    *{animation-duration:.01ms !important;transition-duration:.2s !important;}
    .blob{animation:none !important;}

</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =========================================================
   FIREBASE INIT
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDY2n_zjBcCfUMP_tKucfDodTRoVM4-Hvs",
  authDomain: "metinhas-b0ead.firebaseapp.com",
  projectId: "metinhas-b0ead",
  storageBucket: "metinhas-b0ead.firebasestorage.app",
  messagingSenderId: "482708770706",
  appId: "1:482708770706:web:2e5c8a78d830e48c00fb4b"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const col = (name) => collection(db, name);

/* =========================================================
   STATE
   ========================================================= */
const state = {
  settings: null,
  goals: [], records: [], transactions: [], products: [], purchases: [], challenges: [],
  currentDate: todayStr(),
  activeTab: 'agenda',
  currentUser: null,   // 'p1' | 'p2' — quem está usando ESTE aparelho (salvo localmente)
  lastAction: null,    // para o "Desfazer"
  dashPeriod: 'week',  // filtro do painel
  dashCustom: null,    // {from,to} para período personalizado
};
const modalRoot = document.getElementById('modalRoot');
const ready = { settings:false, goals:false, records:false, transactions:false, products:false, purchases:false, challenges:false };
function allReady(){ return Object.values(ready).every(Boolean); }
function hideLoading(){ const el=document.getElementById('loadingScreen'); if(el) el.style.display='none'; }
function markReady(k){ ready[k]=true; if(allReady()){ hideLoading(); } }

// Se em 6s nem tudo carregou, libera a interface mesmo assim (não prende os cliques)
const loadTimeout = setTimeout(()=>{ if(!allReady()){ hideLoading(); render(); } }, 6000);

// Mostra erro do Firestore na tela de carregamento em vez de travar
function showLoadError(err){
  clearTimeout(loadTimeout);
  const el = document.getElementById('loadingScreen');
  if(!el) return;
  el.innerHTML = `
    <div class="logo">💞 Metinhas</div>
    <div style="max-width:320px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.5;">
      <p style="color:var(--danger);font-weight:600;margin-bottom:8px;">Não consegui conectar ao banco de dados.</p>
      <p style="margin-bottom:4px;"><strong>${err?.code||'erro'}</strong></p>
      <p style="margin-bottom:14px;">Provavelmente as regras do Firestore ainda não permitem leitura/escrita. Confira a aba <strong>Regras</strong> no Firebase Console.</p>
    </div>
    <button class="btn btn-primary" onclick="location.reload()">Tentar de novo</button>
  `;
}
function onSnapErr(name){
  return (err)=>{ console.error('Firestore ['+name+']:', err); showLoadError(err); };
}

let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  setTimeout(()=>{ renderScheduled=false; runSyncThenRender(); }, 120);
}

/* =========================================================
   DATE HELPERS
   ========================================================= */
function fmtDateObj(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(d){
  if(d) return fmtDateObj(d);
  // data de "hoje" no fuso de São Paulo, independente do relógio do aparelho
  try{
    return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  }catch(e){ return fmtDateObj(new Date()); }
}
function nowHHMM(){
  try{
    return new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
  }catch(e){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
}
function addDays(dateStr, n){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return todayStr(dt);
}
function dayOfWeek(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  return new Date(y,m-1,d).getDay();
}
function isoWeekKey(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  const dayNum=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThursday=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week=1+Math.round(((dt-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return `${dt.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}
const DOW_LABELS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTH_LABELS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function fmtDatePt(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return `${DOW_LABELS[dt.getDay()]}, ${d} ${MONTH_LABELS[m-1].slice(0,3)}`;
}
function fmtMoney(v){
  const cur = state.settings?.currency || 'R$';
  const sign = v<0?'-':'';
  return `${sign}${cur} ${Math.abs(v).toFixed(2).replace('.',',')}`;
}

/* =========================================================
   FIRESTORE LISTENERS
   ========================================================= */
onSnapshot(doc(db,'settings','config'), async (snap)=>{
  if(snap.exists()){ state.settings = snap.data(); }
  else {
    const def = { p1:{name:'Você', emoji:'🐻'}, p2:{name:'Ela', emoji:'🐰'}, coupleName:'Metinhas dos Nenéns', currency:'R$',
                  configured:false, allowNegative:true, dailyPenaltyLimit:0 };
    await setDoc(doc(db,'settings','config'), def);
    state.settings = def;
  }
  const _t=document.getElementById('appTitle'); if(_t) _t.textContent = state.settings.coupleName || 'Metinhas';
  markReady('settings'); scheduleRender();
  checkIdentity();
}, onSnapErr('settings'));
onSnapshot(col('goals'), (snap)=>{
  state.goals = snap.docs.map(d=>({id:d.id, ...d.data()}));
  markReady('goals'); scheduleRender();
}, onSnapErr('goals'));
onSnapshot(col('goalRecords'), (snap)=>{
  state.records = snap.docs.map(d=>({id:d.id, ...d.data()}));
  markReady('records'); scheduleRender();
}, onSnapErr('goalRecords'));
onSnapshot(col('transactions'), (snap)=>{
  state.transactions = snap.docs.map(d=>({id:d.id, ...d.data()}));
  markReady('transactions'); scheduleRender();
}, onSnapErr('transactions'));
onSnapshot(col('products'), (snap)=>{
  state.products = snap.docs.map(d=>({id:d.id, ...d.data()}));
  markReady('products'); scheduleRender();
}, onSnapErr('products'));
onSnapshot(col('purchases'), (snap)=>{
  state.purchases = snap.docs.map(d=>({id:d.id, ...d.data()}));
  markReady('purchases'); scheduleRender();
}, onSnapErr('purchases'));
onSnapshot(col('challenges'), (snap)=>{
  state.challenges = snap.docs.map(d=>({id:d.id, ...d.data()}));
  markReady('challenges'); scheduleRender();
}, onSnapErr('challenges'));

/* =========================================================
   CORE ENGINE: periodicidade, geração e resolução de execuções
   ========================================================= */
function instancesFor(goal){
  if(goal.participant==='p1') return ['p1'];
  if(goal.participant==='p2') return ['p2'];
  return goal.responsibilityType==='either' ? ['both'] : ['p1','p2'];
}
function countCompletedInPeriod(goalId, personId, periodKey, periodFn){
  return state.records.filter(r=>r.goalId===goalId && r.personId===personId && r.status==='completed' && periodFn(r.date)===periodKey).length;
}
function goalDue(goal, personId, dateStr){
  const p = goal.periodicity || {type:'daily'};
  if(p.type==='daily') return true;
  if(p.type==='weekly_days') return (p.daysOfWeek||[]).includes(dayOfWeek(dateStr));
  if(p.type==='weekly_count'){
    const wk=isoWeekKey(dateStr);
    return countCompletedInPeriod(goal.id,personId,wk,isoWeekKey) < (p.timesPerWeek||1);
  }
  if(p.type==='monthly_count'){
    const mk=dateStr.slice(0,7);
    return countCompletedInPeriod(goal.id,personId,mk,d=>d.slice(0,7)) < (p.timesPerMonth||1);
  }
  if(p.type==='custom_interval'){
    const anchor = goal.createdAtDate || dateStr;
    const diff = Math.round((new Date(dateStr) - new Date(anchor))/86400000);
    return diff>=0 && diff % (p.intervalDays||1) === 0;
  }
  if(p.type==='yearly_count'){
    const yk=dateStr.slice(0,4);
    return countCompletedInPeriod(goal.id,personId,yk,d=>d.slice(0,4)) < (p.timesPerYear||1);
  }
  if(p.type==='specific_date'){
    return p.date===dateStr;
  }
  return false;
}
let syncing=false;
async function runSyncThenRender(){
  if(!allReady()){ render(); return; }
  if(syncing){ render(); return; }
  syncing=true;
  try{
    await generateRecordsForToday();
    await resolveStalePending();
    await evaluateChallenges();
  } catch(e){ console.error('Erro no sync', e); }
  syncing=false;
  render();
}
async function generateRecordsForToday(){
  const dateStr = todayStr();
  for(const goal of state.goals){
    if(goal.active===false || goal.archived) continue;
    for(const personId of instancesFor(goal)){
      if(!goalDue(goal, personId, dateStr)) continue;
      const exists = state.records.some(r=>r.goalId===goal.id && r.personId===personId && r.date===dateStr);
      if(exists) continue;
      const newRec = {
        goalId: goal.id, goalTitle: goal.title, personId, date: dateStr,
        status:'pending', measuredValue:null,
        measurementType: goal.measurementType, targetValue: goal.targetValue||null, unit: goal.unit||'',
        rewardSnapshot: (goal.reward?.enabled ? Number(goal.reward.amount)||0 : 0),
        penaltySnapshot: (goal.penalty?.enabled ? Number(goal.penalty.amount)||0 : 0),
        amountApplied:null, resolvedAt:null,
      };
      await addDoc(col('goalRecords'), { ...newRec, createdAt: serverTimestamp() });
      // registro temporário COMPLETO (some assim que o snapshot recarregar do Firestore)
      state.records.push({ id:'temp-'+Math.random(), ...newRec });
    }
  }
}
/* ---- Helpers financeiros: idempotência, teto de penalidade, saldo negativo ---- */
function txExists(key){ return !!key && state.transactions.some(t=>t.idemKey===key); }
function todaysPenalties(personId){
  const today=todayStr();
  return state.transactions.filter(t=>t.type==='goal_penalty' && t.personId===personId && t.date===today).reduce((s,t)=>s+Math.abs(t.amount),0);
}
function penaltyCapInfo(personId, rawPenalty){
  const s=state.settings||{}; let amount=rawPenalty; let capped=false;
  const limit=Number(s.dailyPenaltyLimit)||0;
  if(limit>0){ const remaining=Math.max(0, limit - todaysPenalties(personId)); if(amount>remaining){ amount=remaining; capped=true; } }
  if(s.allowNegative===false){ const room=Math.max(0, balance(personId)); if(amount>room){ amount=room; capped=true; } }
  return {amount, capped};
}
async function addTx(data, idemKey){
  if(txExists(idemKey)) return null;   // não cobra/premia duas vezes
  const payload={...data, idemKey:idemKey||null, createdAt:serverTimestamp()};
  const ref=await addDoc(col('transactions'), payload);
  const id=ref?.id||('tmp-'+Math.random());
  state.transactions.push({id, ...payload});  // reflexo imediato (some no próximo snapshot)
  return id;
}

async function resolveStalePending(){
  const today = todayStr();
  const stale = state.records.filter(r=>r.status==='pending' && r.date<today && !String(r.id).startsWith('temp-'));
  for(const r of stale){
    const rawPenalty = r.penaltySnapshot||0;
    if(rawPenalty>0){
      const payPerson = r.personId==='both'?'couple':r.personId;
      const {amount,capped} = penaltyCapInfo(payPerson, rawPenalty);
      await updateDoc(doc(db,'goalRecords',r.id), {status:'failed', amountApplied:-amount, resolvedAt:serverTimestamp()});
      await addTx({personId:payPerson, type:'goal_penalty', amount:-amount,
        description:`Meta não cumprida: ${r.goalTitle}${capped?' (limitado pelo teto)':''}`, relatedId:r.id, date:r.date}, `${r.id}:goal_penalty`);
      r.status='failed';
    } else {
      await updateDoc(doc(db,'goalRecords',r.id), {status:'expired', amountApplied:0, resolvedAt:serverTimestamp()});
      r.status='expired';
    }
  }
}
async function evaluateChallenges(){
  const today = todayStr();
  for(const c of state.challenges){
    if(c.status!=='active') continue;
    let count = c.currentCount||0;
    if(c.linkedGoalId){
      count = state.records.filter(r=>r.goalId===c.linkedGoalId && r.status==='completed' && r.date>=c.startDate && r.date<=c.endDate).length;
    }
    if(count >= c.targetCount){
      await updateDoc(doc(db,'challenges',c.id), {status:'completed', currentCount:count});
      c.status='completed';
      await addTx({personId: c.participant==='both'?'couple':c.participant, type:'challenge_reward', amount:Number(c.reward)||0,
        description:`Desafio concluído: ${c.title}`, relatedId:c.id, date:today}, `${c.id}:challenge_reward`);
    } else if(today > c.endDate){
      await updateDoc(doc(db,'challenges',c.id), {status:'failed', currentCount:count});
      c.status='failed';
    }
  }
}

/* =========================================================
   AÇÕES DE EXECUÇÃO (concluir / não cumprir / pular) + DESFAZER
   ========================================================= */
async function completeRecord(record, measuredValue){
  if(record.status!=='pending') return;   // impede dupla conclusão/recompensa
  let ratio = 1;
  if(record.measurementType!=='boolean' && record.targetValue){
    ratio = Math.max(0, Math.min(1, (Number(measuredValue)||0)/record.targetValue));
  }
  const reward = record.measurementType==='boolean' ? (record.rewardSnapshot||0) : (record.rewardSnapshot||0)*ratio;
  const status = (record.measurementType==='boolean' || ratio>0) ? 'completed' : 'failed';
  const payPerson = record.personId==='both'?'couple':record.personId;
  const txIds=[];
  if(status==='completed'){
    await updateDoc(doc(db,'goalRecords',record.id), {
      status, measuredValue: measuredValue==null?null:Number(measuredValue), amountApplied:reward, resolvedAt:serverTimestamp()
    });
    if(reward>0){
      const id=await addTx({personId:payPerson, type:'goal_reward', amount:reward,
        description:`Meta cumprida: ${record.goalTitle}${ratio<1?` (${Math.round(ratio*100)}%)`:''}`,
        relatedId:record.id, date:record.date}, `${record.id}:goal_reward`);
      if(id) txIds.push(id);
    }
    const goal = state.goals.find(g=>g.id===record.goalId);
    const streakNow = record.personId==='both' ? 0 : computeStreak(record.goalId, record.personId).current + 1;
    celebrate('win', reward, streakNow);
    const bId = await maybeApplyStreakBonus(goal, record.personId); if(bId) txIds.push(bId);
  } else {
    const {amount,capped} = penaltyCapInfo(payPerson, record.penaltySnapshot||0);
    await updateDoc(doc(db,'goalRecords',record.id), {
      status:'failed', measuredValue: measuredValue==null?null:Number(measuredValue), amountApplied:-amount, resolvedAt:serverTimestamp()
    });
    if((record.penaltySnapshot||0)>0){
      const id=await addTx({personId:payPerson, type:'goal_penalty', amount:-amount,
        description:`Meta não cumprida: ${record.goalTitle}${capped?' (limitado pelo teto)':''}`, relatedId:record.id, date:record.date}, `${record.id}:goal_penalty`);
      if(id) txIds.push(id);
    }
    celebrate('fail', amount, 0);
  }
  registerUndo(record.id, txIds);
}
async function failRecord(record){
  if(record.status!=='pending') return;
  const payPerson = record.personId==='both'?'couple':record.personId;
  const {amount,capped} = penaltyCapInfo(payPerson, record.penaltySnapshot||0);
  celebrate('fail', amount, 0);
  await updateDoc(doc(db,'goalRecords',record.id), {status:'failed', amountApplied: amount?-amount:0, resolvedAt:serverTimestamp()});
  const txIds=[];
  if((record.penaltySnapshot||0)>0){
    const id=await addTx({personId:payPerson, type:'goal_penalty', amount:-amount,
      description:`Meta não cumprida: ${record.goalTitle}${capped?' (limitado pelo teto)':''}`, relatedId:record.id, date:record.date}, `${record.id}:goal_penalty`);
    if(id) txIds.push(id);
  }
  registerUndo(record.id, txIds);
}
async function skipRecord(record){
  if(record.status!=='pending') return;
  await updateDoc(doc(db,'goalRecords',record.id), {status:'skipped', amountApplied:0, resolvedAt:serverTimestamp()});
  registerUndo(record.id, []);
}
function registerUndo(recordId, txIds){
  state.lastAction = { recordId, txIds, at:Date.now() };
  showUndoToast();
}
async function performUndo(){
  const a = state.lastAction; if(!a) return;
  state.lastAction = null;
  for(const id of a.txIds){ try{ await deleteDoc(doc(db,'transactions',id)); }catch(e){} }
  try{ await updateDoc(doc(db,'goalRecords',a.recordId), {status:'pending', measuredValue:null, amountApplied:null, resolvedAt:null}); }catch(e){}
  toast('Ação desfeita ↩️');
}
async function maybeApplyStreakBonus(goal, personId){
  if(!goal?.streakBonus?.enabled) return null;
  const streak = computeStreak(goal.id, personId).current;
  const everyN = Number(goal.streakBonus.everyN)||7;
  if(streak>0 && streak % everyN === 0){
    return await addTx({personId: personId==='both'?'couple':personId, type:'streak_bonus', amount:Number(goal.streakBonus.amount)||0,
      description:`Bônus de sequência (${streak} dias): ${goal.title}`, relatedId:goal.id, date:todayStr()}, `${goal.id}:${todayStr()}:streak_bonus`);
  }
  return null;
}
function computeStreak(goalId, personId){
  const completedDates = new Set(state.records.filter(r=>r.goalId===goalId && r.personId===personId && r.status==='completed').map(r=>r.date));
  let d = todayStr();
  const todayRec = state.records.find(r=>r.goalId===goalId && r.personId===personId && r.date===d);
  if(!todayRec || todayRec.status==='pending') d = addDays(d,-1);
  let current=0;
  while(true){
    if(completedDates.has(d)){ current++; d=addDays(d,-1); continue; }
    const rec = state.records.find(r=>r.goalId===goalId && r.personId===personId && r.date===d);
    if(rec && rec.status==='skipped'){ d=addDays(d,-1); continue; }
    break;
  }
  const sorted=[...completedDates].sort();
  let bestRun=0, curRun=0, prev=null;
  for(const dt of sorted){
    curRun = (prev && addDays(prev,1)===dt) ? curRun+1 : 1;
    bestRun = Math.max(bestRun, curRun);
    prev = dt;
  }
  return { current, best: Math.max(bestRun, current) };
}
function bestOverallStreak(){
  let best=0;
  const combos = new Set(state.records.map(r=>r.goalId+'|'+r.personId));
  combos.forEach(c=>{ const [gid,pid]=c.split('|'); best=Math.max(best, computeStreak(gid,pid).best); });
  return best;
}
function balance(personId){
  return state.transactions.filter(t=>t.personId===personId).reduce((s,t)=>s+t.amount,0);
}

function productAvailability(product){
  const unlimited = product.stockQuantity==null;
  if(!unlimited && (product.stockQuantity||0)<=0) return {available:false, reason:'Esgotado'};
  const rel = state.purchases.filter(p=>p.productId===product.id).sort((a,b)=>(b.purchasedAt||'').localeCompare(a.purchasedAt||''));
  const last = rel[0];
  if(last && last.availableAgainAt > todayStr()) return {available:false, reason:`Volta em ${fmtDatePt(last.availableAgainAt)}`};
  return {available:true};
}
async function purchaseProduct(product, personId){
  if(product.stockQuantity!=null){
    await updateDoc(doc(db,'products',product.id), {stockQuantity:(product.stockQuantity||0)-1});
  }
  const availableAgain = addDays(todayStr(), product.cooldownDays||0);
  await addDoc(col('purchases'), {
    productId:product.id, productName:product.name, personId, price:Number(product.price)||0,
    purchasedAt: todayStr(), availableAgainAt: availableAgain, createdAt: serverTimestamp()
  });
  await addDoc(col('transactions'), {
    personId, type:'purchase', amount:-(Number(product.price)||0),
    description:`Compra: ${product.name}`, relatedId:product.id, date:todayStr(), createdAt:serverTimestamp()
  });
}

  };

        <div class="flex-between"><strong>${personEmoji('p2')} ${personLabel('p2')}</strong><span class="muted">${s2.done}/${s2.total}</span></div>
        <div class="progress-track" style="margin-top:8px;"><div class="progress-fill p2" style="width:${s2.pct}%"></div></div>
      </div>
    </div>`;

  const listsEl = document.getElementById('agendaLists');
  const groups = [
    {key:'p1', label:personLabel('p1'), emoji:personEmoji('p1')},
    {key:'p2', label:personLabel('p2'), emoji:personEmoji('p2')},
    {key:'both', label:'Metas do casal', emoji:'❤️'},
  ];
  let html='';
  // aviso de lembretes: metas com lembrete cujo horário já passou e ainda estão pendentes hoje
  if(dateStr===todayStr()){
    const nowT = nowHHMM();
    const dueGoalTitles = [];
    const seen = new Set();
    for(const r of dayRecords){
      if(r.status!=='pending') continue;
      const g = state.goals.find(x=>x.id===r.goalId);
      if(g && g.reminderEnabled && (g.reminderTime||'') <= nowT){
        if(!seen.has(r.goalTitle)){ seen.add(r.goalTitle); dueGoalTitles.push(r.goalTitle); }
      }
    }
    if(dueGoalTitles.length){
      html += `<div class="reminder-banner"><span class="rb-emoji">🔔</span><div>Não esqueçam: ${dueGoalTitles.slice(0,5).join(', ')}${dueGoalTitles.length>5?'…':''}</div></div>`;
    }
  }
  for(const g of groups){
    const recs = dayRecords.filter(r=>r.personId===g.key).sort((a,b)=>(a.goalTitle||'').localeCompare(b.goalTitle||''));
    if(recs.length===0) continue;
    html += `<div class="person-band ${g.key==='both'?'couple':g.key}"><div class="avatar">${g.emoji}</div><strong>${g.label}</strong></div>`;
    for(const r of recs){
      html += renderRecordRow(r);
    }

  }
  listsEl.innerHTML = html;

  // wire actions
  listsEl.querySelectorAll('[data-complete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = state.records.find(r=>r.id===btn.dataset.complete);
      if(rec.measurementType && rec.measurementType!=='boolean'){

      } else {

      }
    });
  });
  listsEl.querySelectorAll('[data-fail]').forEach(btn=>{
    btn.addEventListener('click', ()=>failRecord(state.records.find(r=>r.id===btn.dataset.fail)));

  listsEl.querySelectorAll('[data-skip]').forEach(btn=>{

  });

function renderRecordRow(r){

      `;

    const labelMap={completed:'Concluída', failed:'Não cumprida', skipped:'Pulada', expired:'Expirada', pending:'Pendente'};
    actions = `<span class="status-badge ${r.status}">${labelMap[r.status]||r.status}</span>`;
    if(r.status==='completed' && r.measuredValue!=null && r.targetValue){
      actions += ` <span class="muted">${r.measuredValue}/${r.targetValue} ${r.unit||''}</span>`;

  const streakChip = (()=>{
    if(!goal || r.personId==='both') return '';

  })();
  const stateClass = r.status==='completed' ? 'done' : (r.status==='failed'||r.status==='expired'?'miss':'');
  return `
    <div class="rec-row ${stateClass}">
      <div class="rec-top">

        <div class="rec-money">${moneyLine}</div>
      </div>
      <div class="rec-actions">${actions}</div>

  if(!p) return '';
  if(p.type==='daily') return 'Todos os dias';
  if(p.type==='weekly_days') return (p.daysOfWeek||[]).map(d=>DOW_LABELS[d]).join(', ')||'—';
  if(p.type==='weekly_count') return `${p.timesPerWeek||1}x por semana`;
  if(p.type==='monthly_count') return `${p.timesPerMonth||1}x por mês`;
  if(p.type==='custom_interval') return `A cada ${p.intervalDays||1} dia(s)`;
  if(p.type==='yearly_count') return `${p.timesPerYear||1}x por ano`;
  if(p.type==='specific_date') return `Em ${p.date? fmtDatePt(p.date):'—'}`;
  return '';
}

/* ---- DASHBOARD ---- */
function daysBetweenStr(from,to){ return Math.round((new Date(to)-new Date(from))/86400000); }
function rangeForPeriod(){
  const today=todayStr();
  const p=state.dashPeriod||'week';
  if(p==='today') return [today, today];
  if(p==='week') return [addDays(today,-6), today];
  if(p==='month') return [today.slice(0,7)+'-01', today];
  if(p==='year') return [today.slice(0,4)+'-01-01', today];
  if(p==='custom'){ const c=state.dashCustom||{}; const a=c.from||today, b=c.to||today; return a<=b?[a,b]:[b,a]; }
  return [addDays(today,-6), today];
}
function periodTitle(){
  const today=todayStr();
  const p=state.dashPeriod||'week';
  if(p==='today') return 'Hoje';
  if(p==='week') return 'Últimos 7 dias';
  if(p==='month') return `${MONTH_LABELS[Number(today.slice(5,7))-1]} de ${today.slice(0,4)}`;
  if(p==='year') return `Ano de ${today.slice(0,4)}`;
  if(p==='custom'){ const [a,b]=rangeForPeriod(); return `${fmtDatePt(a)} — ${fmtDatePt(b)}`; }
  return '';
}
function buildBuckets(from,to){
  const n = daysBetweenStr(from,to)+1;
  const mode = n<=14 ? 'day' : (n<=92 ? 'week' : 'month');
  const map=new Map(); const order=[];
  for(let i=0;i<n;i++){
    const d=addDays(from,i);
    let key,label;
    if(mode==='day'){ key=d; label=`${d.slice(8,10)}/${d.slice(5,7)}`; }
    else if(mode==='week'){ key=isoWeekKey(d); label=key.slice(6); }
    else { key=d.slice(0,7); label=MONTH_LABELS[Number(key.slice(5,7))-1].slice(0,3); }
    if(!map.has(key)){ map.set(key,{label,done:0,total:0}); order.push(key); }
  }
  for(const r of state.records){
    if(r.date<from || r.date>to) continue;
    let key;
    if(mode==='day') key=r.date;
    else if(mode==='week') key=isoWeekKey(r.date);
    else key=r.date.slice(0,7);
    const b=map.get(key); if(!b) continue;
    b.total++; if(r.status==='completed') b.done++;
  }
  return order.map(k=>map.get(k));
}
function renderDashboard(){
  // barra de período
  const periods=[['today','Hoje'],['week','Semana'],['month','Mês'],['year','Ano'],['custom','Personalizado']];
  const cur=state.dashPeriod||'week';
  document.getElementById('dashPeriodBar').innerHTML = periods.map(([k,l])=>`<button data-period="${k}" class="${cur===k?'active':''}">${l}</button>`).join('');
  document.getElementById('dashPeriodBar').querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{ state.dashPeriod=b.dataset.period; render(); }));

  const crEl=document.getElementById('dashCustomRange');
  if(cur==='custom'){
    const c=state.dashCustom||{}; const today=todayStr();
    crEl.innerHTML=`<div class="custom-range">
      <div class="field"><label>De</label><input type="date" id="cr-from" value="${c.from||addDays(today,-30)}"></div>
      <div class="field"><label>Até</label><input type="date" id="cr-to" value="${c.to||today}"></div>
    </div>`;
    const upd=()=>{ state.dashCustom={from:document.getElementById('cr-from').value, to:document.getElementById('cr-to').value}; render(); };
    document.getElementById('cr-from').addEventListener('change',upd);
    document.getElementById('cr-to').addEventListener('change',upd);
  } else crEl.innerHTML='';

  document.getElementById('dashPeriodLabel').textContent = periodTitle();

  const [from,to]=rangeForPeriod();
  const rangeRecs = state.records.filter(r=>r.date>=from && r.date<=to && !String(r.id).startsWith('temp-'));
  const resolved = rangeRecs.filter(r=>r.status!=='pending');
  const done = resolved.filter(r=>r.status==='completed').length;
  const failed = resolved.filter(r=>r.status==='failed'||r.status==='expired').length;
  const skipped = resolved.filter(r=>r.status==='skipped').length;
  const taxa = resolved.length ? Math.round(done/resolved.length*100) : 0;
  const rangeTx = state.transactions.filter(t=>t.date>=from && t.date<=to);
  const ganho = rangeTx.filter(t=>t.amount>0 && t.type!=='purchase').reduce((s,t)=>s+t.amount,0);
  const penal = rangeTx.filter(t=>t.type==='goal_penalty').reduce((s,t)=>s+t.amount,0);
  const gasto = rangeTx.filter(t=>t.type==='purchase').reduce((s,t)=>s+t.amount,0);

  document.getElementById('dashStats').innerHTML = `
    <div class="stat-card"><div class="val" style="color:var(--ok)">${done}</div><div class="lbl">Concluídas</div></div>
    <div class="stat-card"><div class="val" style="color:var(--danger)">${failed}</div><div class="lbl">Não cumpridas</div></div>
    <div class="stat-card"><div class="val">${skipped}</div><div class="lbl">Puladas</div></div>
    <div class="stat-card"><div class="val">${taxa}%</div><div class="lbl">Taxa de sucesso</div></div>
    <div class="stat-card"><div class="val" style="color:var(--ok)">${fmtMoney(ganho)}</div><div class="lbl">Ganho</div></div>
    <div class="stat-card"><div class="val" style="color:var(--danger)">${fmtMoney(penal)}</div><div class="lbl">Penalidades</div></div>
    <div class="stat-card"><div class="val">${fmtMoney(Math.abs(gasto))}</div><div class="lbl">Gasto na loja</div></div>
    <div class="stat-card"><div class="val">🔥 ${bestOverallStreak()}</div><div class="lbl">Melhor sequência</div></div>
  `;

  // gráfico adaptativo
  const buckets = buildBuckets(from,to);
  const maxVal = Math.max(1, ...buckets.map(x=>x.total));
  const barW=Math.max(18, Math.min(40, Math.floor(300/Math.max(1,buckets.length))-10)), gap=10, chartH=90;
  const chartW=buckets.length*(barW+gap);
  let bars='';
  buckets.forEach((x,i)=>{
    const h=Math.round((x.total? x.done/maxVal:0)*chartH);
    const totalH=Math.round((x.total/maxVal)*chartH);
    const xPos=i*(barW+gap);
    bars += `<rect x="${xPos}" y="${chartH-totalH}" width="${barW}" height="${totalH}" rx="5" fill="rgba(58,44,80,0.10)"></rect>`;
    bars += `<rect x="${xPos}" y="${chartH-h}" width="${barW}" height="${h}" rx="5" fill="var(--accent)"></rect>`;
    bars += `<text x="${xPos+barW/2}" y="${chartH+14}" text-anchor="middle" style="font-size:8px">${x.label}</text>`;
    if(x.done>0) bars += `<text x="${xPos+barW/2}" y="${chartH-h-4}" text-anchor="middle" style="font-weight:700;fill:var(--ink);font-size:9px">${x.done}</text>`;
  });
  document.getElementById('dashChart').innerHTML = buckets.length
    ? `<svg class="chart" viewBox="0 0 ${Math.max(chartW,10)} ${chartH+22}" width="100%" height="120" preserveAspectRatio="xMidYMid meet">${bars}</svg>`
    : `<p class="muted" style="text-align:center;padding:10px;">Sem dados no período.</p>`;

  // comparação no período
  const cmp = (pid)=>{
    const recs = resolved.filter(r=>r.personId===pid);
    const d = recs.filter(r=>r.status==='completed').length;
    const g = rangeTx.filter(t=>t.personId===pid && t.amount>0 && t.type!=='purchase').reduce((s,t)=>s+t.amount,0);
    const pen = rangeTx.filter(t=>t.personId===pid && t.type==='goal_penalty').reduce((s,t)=>s+t.amount,0);
    let bestStreak=0;
    state.goals.filter(gl=>gl.participant===pid || gl.participant==='both').forEach(gl=>{ bestStreak=Math.max(bestStreak, computeStreak(gl.id, gl.participant==='both'&&gl.responsibilityType==='either'?'both':pid).current); });
    return {total:recs.length, done:d, pct: recs.length?Math.round(d/recs.length*100):0, g, p:pen, bestStreak};
  };
  const c1=cmp('p1'), c2=cmp('p2');
  document.getElementById('dashCompare').innerHTML = `
    <table class="compare">
      <tr><th></th><th>${personEmoji('p1')} ${personLabel('p1')}</th><th>${personEmoji('p2')} ${personLabel('p2')}</th></tr>
      <tr><td>Metas</td><td>${c1.total}</td><td>${c2.total}</td></tr>
      <tr><td>Concluídas</td><td>${c1.done}</td><td>${c2.done}</td></tr>
      <tr><td>Aproveitamento</td><td>${c1.pct}%</td><td>${c2.pct}%</td></tr>
      <tr><td>Ganhos</td><td>${fmtMoney(c1.g)}</td><td>${fmtMoney(c2.g)}</td></tr>
      <tr><td>Penalidades</td><td>${fmtMoney(c1.p)}</td><td>${fmtMoney(c2.p)}</td></tr>
      <tr><td>Streak atual</td><td>🔥 ${c1.bestStreak}</td><td>🔥 ${c2.bestStreak}</td></tr>
    </table>`;

  document.getElementById('dashBadges').innerHTML = BADGE_DEFS.map(b=>{
    const unlocked = b.check();
    return `<div class="badge-tile ${unlocked?'':'locked'}"><div class="b-emoji">${b.emoji}</div><div class="b-title">${b.title}</div></div>`;
  }).join('');
}

document.getElementById('newGoalBtn').addEventListener('click', ()=>openGoalModal(null));

      <label>Tipo de responsabilidade</label>
      <div class="radio-cards">
        <label><input type="radio" name="g-resp" value="each" ${(!goal||goal.responsibilityType!=='either')?'checked':''}>Cada um cumpre a sua</label>

      <div class="field"><label>Unidade</label><input type="text" id="g-unit" value="${goal?.unit||''}" placeholder="ml, min, páginas..."></div>

  };
}

/* =========================================================
   IDENTIDADE VISUAL: temas dinâmicos + fundo vivo (bolhas)
   ========================================================= */
const THEMES=[
  {name:'Romântico', tint:'#FDEFF6', accent:'#E86AA6', accent2:'#B98CF0', blobs:['#FFB3D1','#D3B0F5','#C4B3F7','#FFCFB0','#FFC0E0']},
  {name:'Pôr do sol', tint:'#FFF2E9', accent:'#F0764F', accent2:'#F58AA6', blobs:['#FFB088','#FFC9A0','#FFA9BC','#FFD98A','#FFBBA0']},
  {name:'Oceano',    tint:'#EAF6FF', accent:'#3AA9E0', accent2:'#8AA0F5', blobs:['#8FD4FF','#7BE6D6','#BBADF7','#A8D8FF','#9FE0E8']},
  {name:'Uva',       tint:'#F3ECFF', accent:'#8A5CF0', accent2:'#E06AC4', blobs:['#B48CFF','#9A78E8','#FFA9E0','#93AEFF','#C79BF5']},
  {name:'Fresh',     tint:'#EAFBF2', accent:'#2FB588', accent2:'#4FC4C4', blobs:['#8FE6BC','#7BE0D6','#B0E4FF','#FFE59A','#A6E8C8']},
];
function hexToRgba(hex, a){
  const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
let blobEls=[];
function buildBlobs(){
  const root=document.getElementById('blobs');
  const layout=[
    {w:340,h:340,top:'-6%',left:'-8%',anim:'drift1',dur:26},
    {w:300,h:300,top:'8%',left:'62%',anim:'drift2',dur:32},
    {w:260,h:260,top:'46%',left:'-10%',anim:'drift3',dur:29},
    {w:320,h:320,top:'58%',left:'58%',anim:'drift1',dur:35},
    {w:220,h:220,top:'30%',left:'34%',anim:'drift2',dur:24},
  ];
  root.innerHTML='';
  blobEls=layout.map((l,i)=>{
    const d=document.createElement('div');
    d.className='blob';
    d.style.width=l.w+'px'; d.style.height=l.h+'px'; d.style.top=l.top; d.style.left=l.left;
    d.style.animation=`${l.anim} ${l.dur}s ease-in-out infinite alternate`;
    root.appendChild(d); return d;
  });
}
let themeIndex=0;
function applyTheme(i){
  const t=THEMES[i%THEMES.length];
  const r=document.documentElement.style;
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent-2', t.accent2);
  r.setProperty('--accent-soft', hexToRgba(t.accent,0.14));
  r.setProperty('--tint', t.tint);
  blobEls.forEach((el,idx)=>{ el.style.backgroundColor = t.blobs[idx % t.blobs.length]; });
}
function startThemeEngine(){
  buildBlobs();
  applyTheme(themeIndex);
  setInterval(()=>{ themeIndex=(themeIndex+1)%THEMES.length; applyTheme(themeIndex); }, 30000);
}
startThemeEngine();

function toast(msg){
  const root=document.getElementById('toastRoot');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el); setTimeout(()=>el.remove(), 2600);
}
function showUndoToast(){
  const root=document.getElementById('toastRoot');
  root.querySelectorAll('.toast-undo').forEach(e=>e.remove());
  const el=document.createElement('div'); el.className='toast toast-undo'; el.style.pointerEvents='auto';
  el.innerHTML=`Feito! <button class="undo-btn">Desfazer</button>`;
  el.querySelector('button').onclick=()=>{ el.remove(); performUndo(); };
  root.appendChild(el);
  setTimeout(()=>{ if(el.isConnected) el.remove(); }, 6000);
}
const WIN_LINES=['BOAAAA! 🔥','ISSO! 💪','ARRASOU! ✨','MANDOU BEM! 🎉','ORGULHO! 💖'];
function celebrate(kind, amount, streak){
  const root=document.getElementById('celebrateRoot');
  const box=document.createElement('div'); box.className='celebrate';
  if(kind==='win'){
    const line=WIN_LINES[Math.floor(Math.random()*WIN_LINES.length)];
    box.innerHTML=`
      <div class="big">${streak>=3?'🔥':'🎉'}</div>
      <div class="headline">${line}</div>
      ${amount>0?`<div class="amount win">+${fmtMoney(amount)}</div>`:''}
      ${streak>=2?`<div class="sub">🔥 ${streak} dias seguidos</div>`:''}`;
    spawnParticles(root);
  } else {
    box.innerHTML=`
      <div class="big">💗</div>
      <div class="headline">Amanhã tem outra chance</div>
      ${amount>0?`<div class="amount lose">−${fmtMoney(amount)}</div>`:''}
      <div class="sub">Tá tudo bem, neném ❤️</div>`;
  }
  root.appendChild(box);
  setTimeout(()=>box.remove(), 1500);
}
function spawnParticles(root){
  const emojis=['💖','✨','🎉','⭐','💫'];
  for(let i=0;i<10;i++){
    const p=document.createElement('div'); p.className='particle';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const ang=Math.random()*Math.PI*2, dist=80+Math.random()*90;
    p.style.left='50%'; p.style.top='50%';
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    root.appendChild(p); setTimeout(()=>p.remove(), 950);
  }
}

function expandPer(code){
  if(code==='d') return {type:'daily'};
  if(code[0]==='w') return {type:'weekly_count', timesPerWeek:Number(code.slice(1))||1};
  if(code[0]==='m') return {type:'monthly_count', timesPerMonth:Number(code.slice(1))||1};
  return {type:'daily'};
}
function perShort(code){
  if(code==='d') return 'todo dia';
  if(code[0]==='w'){ const n=Number(code.slice(1)); return n===1?'1x/semana':`${n}x/semana`; }
  if(code[0]==='m'){ const n=Number(code.slice(1)); return n===1?'1x/mês':`${n}x/mês`; }
  return code;
}

function goalExists(baked, participant){
  return state.goals.some(g=>g.title===baked && g.participant===participant);
}
function productExists(name){ return state.products.some(p=>p.name===name); }

async function addLibGoal(item, catObj, selectedPerson){
  const part = item.part || catObj.part;
  const participant = part==='pick' ? selectedPerson : part;
  const m = item.m || 'boolean';
  const baked = `${item.e} ${item.t}`;
  if(goalExists(baked, participant)) return;
  await addDoc(col('goals'), {
    title: baked, description:'',
    participant,
    responsibilityType: participant==='both' ? (item.resp || catObj.resp || 'either') : null,
    measurementType: m,
    targetValue: m==='boolean' ? null : (item.tv||0),
    unit: item.u||'',
    periodicity: expandPer(item.per),
    reward:{ enabled: (item.rw||0)>0, amount: item.rw||0 },
    penalty:{ enabled: (item.pn||0)>0, amount: item.pn||0 },
    streakBonus:{ enabled:false, everyN:7, amount:0 },
    active:true, createdAt:serverTimestamp(), createdAtDate:todayStr(),
  });
}
async function addLibProduct(item){
  if(productExists(item.t)) return;
  await addDoc(col('products'), {
    name:item.t, emoji:item.e, description:item.desc||'',
    price:item.price, stockQuantity:(item.stock===undefined?null:item.stock), cooldownDays:item.cd||0,
    createdAt:serverTimestamp(),
  });
}

    body.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click', ()=>{ libCtx.person=b.dataset.person; renderLibBody(); }));
    body.querySelectorAll('[data-addgoal]').forEach(b=>b.addEventListener('click', async ()=>{

      const cat=LIB_GOALS[ci], it=cat.items[ii];
      const part=it.part||cat.part, participant=part==='pick'?libCtx.person:part;
      libCtx.added.add('g:'+`${it.e} ${it.t}`+':'+participant);
      b.classList.add('added'); b.textContent='✓';
      await addLibGoal(it, cat, libCtx.person);
    }));
    body.querySelectorAll('[data-addcat]').forEach(b=>b.addEventListener('click', async ()=>{
      const ci=Number(b.dataset.addcat); const cat=LIB_GOALS[ci];
      for(const it of cat.items){
        const part=it.part||cat.part, participant=part==='pick'?libCtx.person:part;
        libCtx.added.add('g:'+`${it.e} ${it.t}`+':'+participant);
        await addLibGoal(it, cat, libCtx.person);
      }
      renderLibBody();
    }));

    LIB_PRODUCTS.forEach((cat,ci)=>{
      html += `<div class="lib-cat"><span>${cat.cat}</span><button data-addpcat="${ci}">Adicionar todas</button></div>`;
      cat.items.forEach((it,ii)=>{
        const done = libCtx.added.has('p:'+it.t) || productExists(it.t);
        html += `<div class="lib-item">
          <div class="li-emoji">${it.e}</div>
          <div class="li-body"><div class="li-title">${it.t}</div>

        </div>`;
      });

    body.querySelectorAll('[data-addprod]').forEach(b=>b.addEventListener('click', async ()=>{

async function resetData(mode){
  const dels=[];
  state.records.forEach(r=>{ if(!String(r.id).startsWith('temp-')) dels.push(deleteDoc(doc(db,'goalRecords',r.id))); });
  state.transactions.forEach(t=>dels.push(deleteDoc(doc(db,'transactions',t.id))));
  state.purchases.forEach(p=>dels.push(deleteDoc(doc(db,'purchases',p.id))));
  // devolve o estoque dos produtos com limite e zera progresso de desafios manuais
  state.products.forEach(p=>{ /* estoque volta ao adicionar de novo; mantemos como está */ });
  state.challenges.forEach(c=>{
    if(mode==='all') dels.push(deleteDoc(doc(db,'challenges',c.id)));
    else dels.push(updateDoc(doc(db,'challenges',c.id), {currentCount:0, status:'active'}));
  });
  if(mode==='all'){
    state.goals.forEach(g=>dels.push(deleteDoc(doc(db,'goals',g.id))));
    state.products.forEach(p=>dels.push(deleteDoc(doc(db,'products',p.id))));
  }
  await Promise.all(dels);
}

    <h2>Quem está usando este aparelho?</h2>
    <p class="sub">A escolha fica salva só neste aparelho. No outro celular, cada um escolhe o seu perfil.</p>
    <div class="id-people">
      <div class="id-person" data-pick="p1">
        <div class="big-av avatar p1">${s.p1?.emoji||'🐻'}</div>
        <div class="nm">${s.p1?.name||'Você'}</div>
      </div>
      <div class="id-person" data-pick="p2">
        <div class="big-av avatar p2">${s.p2?.emoji||'🐰'}</div>
        <div class="nm">${s.p2?.name||'Ela'}</div>
      </div>
    </div>
    ${isSwitch?'<button class="btn btn-ghost" id="pick-cancel" style="margin-top:6px;">Cancelar</button>':''}
  `);
  modalRoot.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click', ()=>{
    const person = el.dataset.pick;
    const pin = state.settings?.[person]?.pin;
    if(pin){ askPin(person, ()=>selectDeviceUser(person)); }
    else selectDeviceUser(person);
  }));
  const cancel=document.getElementById('pick-cancel'); if(cancel) cancel.onclick = ()=>{ closeIdOverlay(); };
}

function selectDeviceUser(person){
  state.currentUser = person; state._identityChecked = true;
  try{ localStorage.setItem(DEVICE_KEY, person); }catch(e){}
  closeIdOverlay(); renderDeviceUser(); render();
}

function askPin(person, onOk){
  const s=state.settings||{};
  let entered='';
  const draw=()=>{
    idOverlay(`
      <div style="font-size:30px;">🔢</div>
      <h2>Oi, ${s[person]?.name||''}!</h2>
      <p class="sub">Digite seu PIN de 4 dígitos.</p>
      <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot ${i<entered.length?'filled':''}"></div>`).join('')}</div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="back">⌫</button>
        <button data-k="0">0</button>
        <button data-k="cancel">✕</button>
      </div>
    `);
    modalRoot.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click', ()=>{
      const k=b.dataset.k;
      if(k==='cancel'){ showUserPicker(true); return; }
      if(k==='back'){ entered=entered.slice(0,-1); draw(); return; }
      if(entered.length<4){ entered+=k; }
      if(entered.length===4){
        if(entered===String(s[person].pin)){ onOk(); }
        else { toast('PIN incorreto 😅'); entered=''; setTimeout(draw,300); }
      } else draw();
    }));
  };
  draw();
}

function renderDeviceUser(){
  const slot=document.getElementById('deviceUserSlot');
  if(!slot) return;
  if(!state.currentUser){ slot.innerHTML=''; return; }
  const p=state.currentUser;
  slot.innerHTML = `<button class="device-chip" id="deviceChip">
    <span class="av avatar ${p}">${personEmoji(p)}</span>
    <span>${personLabel(p)}</span> <span class="sw">· trocar</span>
  </button>`;
  document.getElementById('deviceChip').onclick = ()=>showUserPicker(true);
}

/* =========================================================
   ARQUIVADAS — restaurar ou excluir de vez
   ========================================================= */
function openArchivedModal(kind){
  const isGoals = kind==='goals';
  const items = (isGoals?state.goals:state.products).filter(x=>x.archived);
  openModalHtml(`
    <button class="modal-close" id="mClose">×</button>
    <h3>🗄️ ${isGoals?'Metas':'Recompensas'} arquivadas</h3>
    ${items.length===0?`<p class="muted">Nada arquivado aqui.</p>`:''}
    <div id="archList"></div>
  `);
  document.getElementById('mClose').onclick = closeModal;
  const list=document.getElementById('archList');
  list.innerHTML = items.map(it=>`
    <div class="lib-item">
      <div class="li-emoji">${isGoals?'🎯':(it.emoji||'🎁')}</div>
      <div class="li-body"><div class="li-title">${isGoals?it.title:it.name}</div></div>
      <div class="btn-row">
        <button class="btn btn-sm" data-restore="${it.id}">Restaurar</button>
        <button class="btn btn-ghost btn-sm" data-purge="${it.id}">Excluir</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click', async ()=>{
    await updateDoc(doc(db, isGoals?'goals':'products', b.dataset.restore), {archived:false});
    openArchivedModal(kind);
  }));
  list.querySelectorAll('[data-purge]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Excluir de vez? O histórico já registrado é mantido, mas o item some para sempre.')){
      await deleteDoc(doc(db, isGoals?'goals':'products', b.dataset.purge));
      openArchivedModal(kind);
    }
  }));
}
window.__archived = openArchivedModal;

// dispara a checagem de identidade também no primeiro carregamento (caso settings já exista)
checkIdentity();

/* =========================================================
   ADMIN — correção de estoque e extrato completo
   ========================================================= */
function openStockAdmin(){
  const prods = [...state.products].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  openModalHtml(`
    <button class="modal-close" id="mClose">×</button>
    <h3>📦 Corrigir estoque</h3>
    <p class="muted" style="margin-bottom:12px;">Ajuste o estoque de cada recompensa. Marque "∞" para estoque ilimitado.</p>
    ${prods.length===0?'<p class="muted">Nenhuma recompensa cadastrada.</p>':''}
    <div id="stockList"></div>
  `);
  document.getElementById('mClose').onclick = closeModal;
  const list=document.getElementById('stockList');
  list.innerHTML = prods.map(p=>`
    <div class="lib-item">
      <div class="li-emoji">${p.emoji||'🎁'}</div>
      <div class="li-body"><div class="li-title">${p.name}${p.archived?' <span class="muted">(arquivada)</span>':''}</div></div>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;">∞<input type="checkbox" data-unl="${p.id}" ${p.stockQuantity==null?'checked':''} style="width:16px;height:16px;accent-color:var(--accent);"></label>
      <input type="number" data-stock="${p.id}" value="${p.stockQuantity??''}" ${p.stockQuantity==null?'disabled':''} style="width:64px;padding:7px;border-radius:9px;border:1px solid var(--hair);font-size:13px;">
      <button class="lib-add" data-save="${p.id}">Salvar</button>
    </div>`).join('');
  list.querySelectorAll('[data-unl]').forEach(chk=>chk.addEventListener('change',()=>{
    const inp=list.querySelector(`[data-stock="${chk.dataset.unl}"]`); inp.disabled=chk.checked;
  }));
  list.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click', async ()=>{
    const id=b.dataset.save;
    const unl=list.querySelector(`[data-unl="${id}"]`).checked;
    const val=list.querySelector(`[data-stock="${id}"]`).value;
    await updateDoc(doc(db,'products',id), {stockQuantity: unl?null:(Number(val)||0)});
    b.classList.add('added'); b.textContent='✓';
    setTimeout(()=>{ b.classList.remove('added'); b.textContent='Salvar'; }, 1200);
  }));
}

function openTxAdmin(filter){
  const label={all:'Todas', p1:personLabel('p1'), p2:personLabel('p2'), couple:'Casal'};
  const typeLabel={goal_reward:'Recompensa', goal_penalty:'Penalidade', purchase:'Compra', streak_bonus:'Bônus streak', challenge_reward:'Desafio', manual_adjustment:'Ajuste manual'};
  let txs=[...state.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(filter && filter!=='all') txs=txs.filter(t=>t.personId===filter);
  openModalHtml(`
    <button class="modal-close" id="mClose">×</button>
    <h3>🧾 Transações</h3>
    <div class="lib-seg" style="margin-bottom:10px;">
      ${['all','p1','p2','couple'].map(k=>`<button data-txf="${k}" class="${(filter||'all')===k?'active':''}">${k==='all'?'Todas':(k==='couple'?'❤️ Casal':personEmoji(k)+' '+label[k])}</button>`).join('')}
    </div>
    <p class="muted" style="margin-bottom:8px;">${txs.length} lançamento(s) · saldo do filtro: ${fmtMoney(txs.reduce((s,t)=>s+t.amount,0))}</p>
    <div id="txList" style="max-height:52vh;overflow-y:auto;"></div>
  `);
  document.getElementById('mClose').onclick = closeModal;
  modalRoot.querySelectorAll('[data-txf]').forEach(b=>b.addEventListener('click',()=>openTxAdmin(b.dataset.txf)));
  const list=document.getElementById('txList');
  list.innerHTML = txs.length? txs.slice(0,300).map(t=>`
    <div class="flex-between" style="padding:8px 2px;border-bottom:1px solid var(--hair);font-size:12.5px;gap:8px;">
      <div style="min-width:0;">
        <div style="font-weight:600;">${personEmoji(t.personId)} ${t.description||typeLabel[t.type]||t.type}</div>
        <div class="muted" style="font-size:11px;">${t.date||''} · ${typeLabel[t.type]||t.type}</div>
      </div>
      <div style="font-weight:800;white-space:nowrap;color:${t.amount>=0?'var(--ok)':'var(--danger)'}">${t.amount>=0?'+':''}${fmtMoney(t.amount)}</div>
    </div>`).join('') : '<p class="muted">Nenhuma transação.</p>';
}
window.__stockAdmin = openStockAdmin;
window.__txAdmin = openTxAdmin;

</script>
